[package]
name = "remote-rustdesk-websocket"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
remote-transport = { path = "../../crates/remote-transport" }
hbb_common = { path = "../../../libs/hbb_common" }
tokio = { version = "1.44", features = ["time", "net"] }
url = "2.5"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { git = "https://github.com/rustdesk-org/tokio-tungstenite", rev = "c241b11b03de4881faf1ecd2fe6e867c92f3013b", version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1.0.4"

[dev-dependencies]
tokio = { version = "1.44", features = ["macros", "rt", "net", "time"] }

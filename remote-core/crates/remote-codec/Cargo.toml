[package]
name = "remote-codec"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
scrap = { path = "../../../libs/scrap" }
base = { path = "../../../libs/base" }
remote-protocol = { path = "../remote-protocol" }

[features]
linux-pkg-config = ["scrap/linux-pkg-config"]
wayland = ["scrap/wayland"]
drm = ["scrap/drm"]
hwcodec = ["scrap/hwcodec"]
vram = ["scrap/vram"]
mediacodec = ["scrap/mediacodec"]

[dev-dependencies]
remote-capture = { path = "../remote-capture" }
remote-transport = { path = "../remote-transport" }
tokio = { version = "1.44", features = ["macros", "rt"] }

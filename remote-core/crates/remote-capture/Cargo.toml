[package]
name = "remote-capture"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
scrap = { path = "../../../libs/scrap" }

[features]
# Mirrors the source backend's optional native build feature.
linux-pkg-config = ["scrap/linux-pkg-config"]
wayland = ["scrap/wayland"]
drm = ["wayland", "scrap/drm"]
hwcodec = ["scrap/hwcodec"]
vram = ["hwcodec", "scrap/vram"]
mediacodec = ["scrap/mediacodec"]

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "wingdi", "windef", "minwindef", "ntdef", "basetsd", "winnt"] }

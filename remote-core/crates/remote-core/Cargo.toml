[package]
name = "remote-core"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
remote-input = { path = "../remote-input" }
remote-session = { path = "../remote-session" }
remote-codec = { path = "../remote-codec" }
remote-protocol = { path = "../remote-protocol" }
remote-transport = { path = "../remote-transport" }

[dev-dependencies]
remote-rustdesk-websocket = { path = "../../adapters/rustdesk" }
remote-capture = { path = "../remote-capture" }
remote-security = { path = "../remote-security" }
getrandom = "0.2"
tokio = { version = "1.44", features = ["macros", "rt", "time"] }
zeroize = "1.8"

[package]
name = "remote-node"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
remote-capture = { path = "../../crates/remote-capture" }
napi = { version = "2.16", default-features = false, features = ["napi6"] }
napi-derive = "2.16"

[build-dependencies]
napi-build = "2"

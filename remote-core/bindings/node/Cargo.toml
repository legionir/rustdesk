[package]
name = "remote-node"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
remote-capture = { path = "../../crates/remote-capture" }
remote-codec = { path = "../../crates/remote-codec" }
napi = { version = "2.16", default-features = false, features = ["napi6"] }
napi-derive = "2.16"

[features]
linux-pkg-config = ["remote-capture/linux-pkg-config", "remote-codec/linux-pkg-config"]
wayland = ["remote-capture/wayland", "remote-codec/wayland"]
drm = ["remote-capture/drm", "remote-codec/drm"]
hwcodec = ["remote-capture/hwcodec", "remote-codec/hwcodec"]
vram = ["remote-capture/vram", "remote-codec/vram"]
mediacodec = ["remote-capture/mediacodec", "remote-codec/mediacodec"]

[build-dependencies]
napi-build = "2"
